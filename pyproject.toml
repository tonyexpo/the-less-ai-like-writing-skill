[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The pattern tables are long string literals by design.
"tools/patterns.py" = ["E501"]
# Fixtures are deliberately bad prose.
"tests/fixtures/*" = ["ALL"]
