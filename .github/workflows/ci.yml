name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: python -m pytest -q

  scorer-selfcheck:
    name: scorer self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scorer has no runtime dependencies. If this step needs a pip
      # install, something has crept into tools/.
      - name: Score the human corpus (must stay in the low band)
        run: python -m tools.slopscore --quiet --max-score 5 tests/fixtures/clean/*.md

      - name: Score the slop corpus (must stay in the rewrite band)
        run: |
          python - <<'PY'
          import glob, sys
          from tools.slopscore import score_file
          bad = [p for p in glob.glob("tests/fixtures/slop/*.md") if score_file(p).total < 12]
          if bad:
              sys.exit(f"slop fixtures no longer reach the rewrite band: {bad}")
          print("slop corpus ok")
          PY

      - name: Charts match the committed eval results
        run: |
          python -m tools.render_chart evals/results/latest.json
          git diff --exit-code -- assets/ \
            || { echo "::error::assets/ is stale. Run: python -m tools.render_chart"; exit 1; }
